services:
  torus:
    build:
      context: ..
      dockerfile: Dockerfile

    command:
      - -config
      - /etc/torus/torus.yaml

    volumes:
      - ./torus/torus-https.yaml:/etc/torus/torus.yaml:ro
      - ./certs/cert.pem:/etc/torus/tls/cert.pem:ro
      - ./certs/key.pem:/etc/torus/tls/key.pem:ro

    ports:
      - "8443:8443"

    depends_on:
      - backend-a
      - backend-b

    restart: unless-stopped

  backend-a:
    build:
      context: ..
      dockerfile: Dockerfile.mock

    command:
      - "3001"

    expose:
      - "3001"

    restart: unless-stopped

  backend-b:
    build:
      context: ..
      dockerfile: Dockerfile.mock

    command:
      - "3002"

    expose:
      - "3002"

    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.7.1

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d

    volumes:
      - ./prometheus/full-stack-https.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data-https:/prometheus

    ports:
      - "9090:9090"

    depends_on:
      - torus

    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin

    ports:
      - "3000:3000"

    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data-https:/var/lib/grafana

    depends_on:
      - prometheus

    restart: unless-stopped

volumes:
  prometheus-data-https:
  grafana-data-https:
