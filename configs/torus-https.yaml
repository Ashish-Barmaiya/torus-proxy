apiVersion: v1

server:
  addr: ":8443"

tls:
  cert_file: "configs/cert.pem"
  key_file: "configs/key.pem"
  min_version: "1.2"

health:
  interval_ms: 5000
  timeout_ms: 2000
  path: /health

observability:
  enabled: true

routes:
  - path: /api
    upstream:
    - "http://localhost:3001"
    - "http://localhost:3002"

